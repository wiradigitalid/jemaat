# goals.yaml — SSOT for BG, the product's goals. Nothing else lives here.
#
# Keys are English; prose values follow the product's chosen `doc_language`.
#
# ONE FILE, ONE WRITER, ONE GATE. This file is `wdi-problem`'s, written at G1 when the brief lands.
# CAP, FR, NFR, and UJ all belong to an initiative instead, and live in
# `requirements-<slug>.yaml` — the slug being that PRD's own folder name under `.what/_prd/`.
# That file is `wdi-product`'s, written at G2.
#
# `CAP` is NOT here, and the reason is worth writing down because the opposite was tried first: a
# capability is declared by a feature, one feature is one capability, and a feature lives in exactly
# one PRD. The argument for keeping CAP at the product level was that `depends_on` between
# capabilities crosses initiatives — but that buys nothing, because every validator reads the MERGED
# view of all requirement files and never opens one by name. A cross-file `depends_on` resolves
# exactly as well as a same-file one.
#
# IDS ARE ALLOCATED ONCE AND THE SEQUENCE IS GLOBAL TO THE PRODUCT. `FR-12` means one thing in this
# repo no matter which file holds it — that is what lets a ticket say `satisfies: [FR-12]` without
# also naming the PRD. `id-allocated-once` fails when two files declare the same id.

goals:
  - id: BG-1
    title: "Unified Membership and Household Registry"
    statement: "Provide church administrators with a single, reliable source of truth for congregants, family structures, and household relationships."
    measure: "100% of church membership and household linkages consolidated in a structured database, replacing fragmented spreadsheets."

  - id: BG-2
    title: "Ministry Roster and Volunteer Scheduling"
    statement: "Enable church coordinators to plan ministry schedules, assign volunteer roles, and track serving commitments transparently."
    measure: "Service rosters scheduled and published with automated role notifications, achieving at least 80% confirmed volunteer responses prior to service."

  - id: BG-3
    title: "Small Group Coordination and Mobile Workflows"
    statement: "Empower care group leaders and members with mobile tools for meeting schedules, RSVP confirmation, and attendance recording."
    measure: "Care groups record weekly attendance and meeting RSVPs via mobile within 24 hours of each gathering."

  - id: BG-4
    title: "Self-Service Member and Visitor Portal"
    statement: "Provide congregants and guests with direct mobile access to verified church announcements, service schedules, personal serving rosters, and guest onboarding."
    measure: "Active members access their service assignments and church updates directly from mobile without requiring manual administrative broadcast."

  - id: BG-5
    title: "Digital Automation for Daily Church Workflows"
    statement: "Transition traditionally manual and paper-bound church workflows into automated digital reminders, event check-ins, and guest follow-up queues."
    measure: "Elimination of paper attendance sheets and manual phone reminders for standard weekly church events."
