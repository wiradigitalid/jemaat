# components.yaml — SSOT for Product Components, containers, and Logical Components
#
# Three different things, two of which share the word "component":
#   Product Component (PC) — a DOMAIN slice, a surface a user could name
#   Container              — a unit that runs or deploys on its own; owned by C4 L2
#   Logical Component (LC) — one nameable build unit
#
# `mode` — DOCUMENT DEPTH. Written ONLY on a component that genuinely needs to differ from global.
# `risk_accepted` — REVIEW INTENSITY, not depth. low · medium · high
# `owns` — the domain entities this component is AUTHORISED TO WRITE.
# `g4_passed` — only means something on a component at a mode above catalog.
#
# A component is born through wdi-init intent `component` at the tail of G2. This file is born empty.

product_components:
  - id: membership
    name: "Membership & Households"
    purpose: "Core personal records, family structures, households, and member lifecycle tracking"
    risk_accepted: medium
    risk_note: "Handles personal data (names, phone numbers, addresses, family linkages)"
    g4_passed: true
    containers:
      - api
      - web
      - mobile
    owns:
      - person
      - household
      - family_relationship
      - membership_record

  - id: serving
    name: "Volunteer Scheduling & Rosters"
    purpose: "Ministry departments, service roles, roster planning, and volunteer confirmations"
    risk_accepted: low
    g4_passed: true
    containers:
      - api
      - web
      - mobile
    owns:
      - ministry_team
      - serving_role
      - service_schedule
      - roster_assignment
      - volunteer_availability

  - id: caregroups
    name: "Care Groups & Attendance"
    purpose: "Small group management, meeting schedules, attendance logging, and pastoral monitoring"
    risk_accepted: low
    g4_passed: true
    containers:
      - api
      - web
      - mobile
    owns:
      - care_group
      - group_membership
      - meeting_session
      - attendance_record

  - id: portal
    name: "Congregational Portal & Workflows"
    purpose: "Mobile bulletin, weekly schedules, guest onboarding, and automated reminders"
    risk_accepted: low
    g4_passed: true
    containers:
      - api
      - web
      - mobile
    owns:
      - church_profile
      - announcement
      - sermon_bulletin
      - guest_intake_entry
      - notification_event

platform_owns: []

containers:
  - id: api
    name: "Go Backend REST API"
    type: service
    built: true
    path: apps/api
    technology: "Go 1.22, Gin/Chi, PostgreSQL, SQLC/pgx"

  - id: web
    name: "React Web Admin"
    type: web
    built: true
    path: apps/web
    technology: "React 18, Vite, TypeScript, Tailwind CSS, shadcn/ui"

  - id: mobile
    name: "Flutter Mobile Client"
    type: mobile
    built: true
    path: apps/mobile
    technology: "Flutter 3.x, Dart, SQLite (sqflite/drift)"

  - id: db
    name: "PostgreSQL Database"
    type: database
    built: false
    technology: "PostgreSQL 16"

