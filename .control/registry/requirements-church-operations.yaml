    priority: P0
    target_release: v0.1.0
    depends_on: []

  - id: CAP-2
    goal: BG-2
    title: "Ministry Roster and Volunteer Scheduling"
    priority: P0
    target_release: v0.1.0
    depends_on:
      - CAP-1

  - id: CAP-3
    goal: BG-3
    title: "Care Group Operations and Attendance"
    priority: P0
    target_release: v0.1.0
    depends_on:
      - CAP-1

  - id: CAP-4
    goal: BG-4
    title: "Congregational Portal and Service Directory"
    priority: P0
